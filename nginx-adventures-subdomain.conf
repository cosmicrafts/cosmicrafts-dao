server {
    server_name adventures.cosmicrafts.com;

    root /var/www/adventures.cosmicrafts.com;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Brotli compression for Unity WebGL files
    location ~* \.data\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~* \.framework\.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Handle HTML files
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Main location block
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Add canonical header for this subdomain
        add_header Link "<https://adventures.cosmicrafts.com$request_uri>; rel=\"canonical\"" always;
    }

    # Robots.txt and sitemap
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/xml";
        try_files $uri =404;
    }

    # Block development files
    location ~* /node_modules/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* /\.(env|git|svn|hg|bzr|cvs) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/adventures.cosmicrafts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adventures.cosmicrafts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

server {
    if ($host = adventures.cosmicrafts.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name adventures.cosmicrafts.com;
    return 404;
}
