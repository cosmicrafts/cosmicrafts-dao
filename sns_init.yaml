name: Cosmicrafts

description: >
    Forge your empire in the Metaverse, unleash your inner Spiral power and master the depths of the Dark Rift.

logo: logo.png

url: https://cosmicrafts.com

NnsProposal:
    title: "NNS Proposal to create an SNS named 'Cosmicrafts'"
    url: "https://forum.dfinity.org/t/cosmicrafts-dao-sns-launch/42289"
    summary:  |
      # Summary
      Proposal to create an SNS DAO for Cosmicrafts.

      # About
      Cosmicrafts brings you a seat at the table of a Metaverse franchise built entirely on the Internet Computer, we're introducing a new era of franchise ownership, stakeholder participation, and meaningful economic rewards. Backed by cutting-edge technology and over 8 years of development behind it, we've got a brand ready to grow, backed by a solid foundation and a system designed for action.      
      [Cosmicrafts](https://cosmicrafts.com/)
      
      ## Token distribution
      **Distribution**
      * Total token supply -  1 Billion
      * Allocated to treasury -  76%
      * Allocated to decentralization sale -  12%
      * Allocated to developer neurons -  8%
      * Allocated to seed investors - 4%

      * The Ledger Transaction fee is 0.01 SPIRAL
      
      **Decentralization SWAP**
      * Min participation - 100 ICP
      * Min participants -  10
      * Min to be raised -  100 ICP
      * Max to be raised -  100,000 ICP

      **Learn more**
      * [Whitepaper](https://cosmicrafts.com/whitepaper)
      * [Github](https://github.com/cosmicrafts)
      * [Website](https://cosmicrafts.com/ )

