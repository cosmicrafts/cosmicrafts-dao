server {
    server_name cosmicrafts.com www.cosmicrafts.com;

    root /var/www/cosmicrafts.com;
    index index.html;

    # Security headers for better SEO and security scores
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Brotli compression for Unity WebGL files
    location ~* \.data\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~* \.framework\.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        try_files $uri =404;
    }

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Handle HTML files with proper caching
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # Robots.txt and sitemap handling - MUST come before main location block
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/xml";
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
        break;
    }

    # Handle /profile route for search engines - return 404 for unauthenticated access
    location = /profile {
        # Check if user agent is a search engine
        if ($http_user_agent ~* (bot|crawler|spider|googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora|skypeuripreview|whatsapp|telegram|discord)) {
            return 404;
        }
        
        # For regular users, let Vue Router handle it
        try_files $uri $uri/ /index.html;
    }

    # Handle /game route - redirect to games page
    location = /game {
        return 301 https://cosmicrafts.com/games;
    }

    # Main location block with proper fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Add canonical header to prevent duplicate content issues
        add_header Link "<https://cosmicrafts.com$request_uri>; rel=\"canonical\"" always;
    }

    # Handle query parameter URLs - redirect to canonical version
    location ~* ^/\? {
        # Remove common tracking parameters and redirect to clean URL
        if ($args ~* "ref=|trk=") {
            return 301 https://cosmicrafts.com/;
        }
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL: Block access to node_modules and development files
    location ~* /node_modules/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* /\.(env|git|svn|hg|bzr|cvs) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* /(package\.json|package-lock\.json|yarn\.lock|composer\.json|composer\.lock) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* /(\.config|\.vscode|\.idea|\.DS_Store|Thumbs\.db) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* /(test|tests|spec|__tests__|coverage|\.nyc_output) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cosmicrafts.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cosmicrafts.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Additional SSL security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

# Redirect www to non-www (canonical)
server {
    listen 443 ssl http2;
    server_name www.cosmicrafts.com;
    
    ssl_certificate /etc/letsencrypt/live/cosmicrafts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cosmicrafts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Redirect www to non-www
    return 301 https://cosmicrafts.com$request_uri;
}

# HTTP to HTTPS redirect
server {
    if ($host = www.cosmicrafts.com) {
        return 301 https://cosmicrafts.com$request_uri;
    }

    if ($host = cosmicrafts.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name cosmicrafts.com www.cosmicrafts.com;
    return 404;
}
